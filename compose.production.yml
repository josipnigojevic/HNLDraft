name: hnl38

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      HNL_API_HOST: 0.0.0.0
      HNL_API_PORT: "8000"
      HNL_ROOMS_DB: /data/rooms.sqlite3
      HNL_CATALOG_PATH: /app/data/hnl_draft_catalog.json
      HNL_ALLOWED_ORIGINS: "https://${DOMAIN:?Set DOMAIN in .env.production},https://www.${DOMAIN:?Set DOMAIN in .env.production}"
      HNL_PUBLIC_URL: "https://${DOMAIN:?Set DOMAIN in .env.production}"
      HNL_AUTH_PEPPER: "${HNL_AUTH_PEPPER:?Set HNL_AUTH_PEPPER in .env.production}"
      HNL_SECURE_COOKIES: "${HNL_SECURE_COOKIES:-1}"
      HNL_AUTH_SESSION_SECONDS: "${HNL_AUTH_SESSION_SECONDS:-2592000}"
      HNL_PASSWORD_SCRYPT_N: "${HNL_PASSWORD_SCRYPT_N:-131072}"
      HNL_PASSWORD_RESET_SECONDS: "${HNL_PASSWORD_RESET_SECONDS:-1800}"
      HNL_PASSWORD_RESET_EXPOSE_TOKEN: "0"
      HNL_SMTP_HOST: "${HNL_SMTP_HOST:?Set HNL_SMTP_HOST in .env.production}"
      HNL_SMTP_PORT: "${HNL_SMTP_PORT:-587}"
      HNL_SMTP_USERNAME: "${HNL_SMTP_USERNAME:?Set HNL_SMTP_USERNAME in .env.production}"
      HNL_SMTP_PASSWORD: "${HNL_SMTP_PASSWORD:?Set HNL_SMTP_PASSWORD in .env.production}"
      HNL_SMTP_FROM: "${HNL_SMTP_FROM:?Set HNL_SMTP_FROM in .env.production}"
      HNL_SMTP_STARTTLS: "${HNL_SMTP_STARTTLS:-1}"
      HNL_SMTP_SSL: "${HNL_SMTP_SSL:-0}"
      HNL_SMTP_TIMEOUT_SECONDS: "${HNL_SMTP_TIMEOUT_SECONDS:-10}"
      HNL_TRUST_PROXY: "1"
      HNL_AUTH_RATE_LIMIT_ATTEMPTS: "${HNL_AUTH_RATE_LIMIT_ATTEMPTS:-10}"
      HNL_AUTH_RATE_LIMIT_WINDOW_SECONDS: "${HNL_AUTH_RATE_LIMIT_WINDOW_SECONDS:-300}"
      HNL_ROOM_TTL_SECONDS: "${HNL_ROOM_TTL_SECONDS:-86400}"
    volumes:
      - hnl_rooms:/data
    expose:
      - "8000"
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).read()"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - app
      - outbound
    logging: &production-logging
      driver: local
      options:
        max-size: 10m
        max-file: "5"

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SIM_API_URL: /api
    environment:
      NEXT_PUBLIC_SIM_API_URL: /api
      NEXT_PUBLIC_SITE_URL: "https://${DOMAIN:?Set DOMAIN in .env.production}"
    expose:
      - "3000"
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      api:
        condition: service_healthy
    networks:
      - app
    logging: *production-logging

  caddy:
    image: caddy:2-alpine
    environment:
      DOMAIN: "${DOMAIN:?Set DOMAIN in .env.production}"
      ACME_EMAIL: "${ACME_EMAIL:?Set ACME_EMAIL in .env.production}"
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    networks:
      - edge
      - app
    logging: *production-logging

networks:
  edge:
  app:
    internal: true
  # The API has no published port, but needs outbound DNS/TLS for the
  # transactional SMTP provider used by password recovery.
  outbound:

volumes:
  hnl_rooms:
  caddy_data:
  caddy_config:
