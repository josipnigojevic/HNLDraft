services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      HNL_API_HOST: 0.0.0.0
      HNL_API_PORT: "8000"
      HNL_ROOMS_DB: /data/rooms.sqlite3
      HNL_CATALOG_PATH: /app/data/hnl_draft_catalog.json
      HNL_ALLOWED_ORIGINS: "${HNL_ALLOWED_ORIGINS:-http://localhost:3001,http://127.0.0.1:3001}"
      HNL_PUBLIC_URL: "${HNL_PUBLIC_URL:-http://localhost:3001}"
      # Opt-in local-only convenience for testing without an SMTP provider.
      # Keep disabled whenever this port is reachable by another device.
      HNL_PASSWORD_RESET_EXPOSE_TOKEN: "${HNL_PASSWORD_RESET_EXPOSE_TOKEN:-0}"
    volumes:
      - hnl_rooms:/data
    ports:
      - "${API_PORT:-8002}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).read()"
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SIM_API_URL: "${NEXT_PUBLIC_SIM_API_URL:-http://localhost:8002}"
    environment:
      NEXT_PUBLIC_SIM_API_URL: "${NEXT_PUBLIC_SIM_API_URL:-http://localhost:8002}"
    ports:
      - "${WEB_PORT:-3001}:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  hnl_rooms:
